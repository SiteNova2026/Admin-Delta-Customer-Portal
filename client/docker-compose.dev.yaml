
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: delta-customer-frontend-dev

    restart: unless-stopped

    ports:
      - "5174:5173"

    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

    environment:
      - NODE_ENV=development

volumes:
  frontend_node_modules:
