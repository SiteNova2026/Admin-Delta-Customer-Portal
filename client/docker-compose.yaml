name: admin-delta-customer-portal
services:
  frontend-dev:
    profiles:
      - development
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: delta-customer-frontend-dev
    restart: unless-stopped
    ports:
      - "5174:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development

  frontend-prod:
    profiles:
      - production
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: delta-customer-frontend-prod
    restart: unless-stopped
    ports:
      - "8083:80"

volumes:
  frontend_node_modules:
